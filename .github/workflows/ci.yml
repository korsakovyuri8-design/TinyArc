# Проверки на каждый пуш.
#
# Render развёртывает ветку автоматически, и без этой стены сломанное уезжает
# на живой домен прежде, чем кто-то заметит. Здесь оно останавливается.
#
# Три работы вместо одной намеренно. Первая — быстрая: тесты, типы, сборка;
# она отвечает за минуту-две и ловит почти всё. Вторая поднимает сервер и
# гоняет браузер. Третья делает то же самое на настоящем Postgres.
#
# Смешивать их значит не понимать по красному значку, что именно сломалось.
#
# Третья появилась после того, как прогон по живому Postgres нашёл две вещи,
# которых на файловой базе не видно вовсе: нулевой байт в тексте она хранит, а
# Postgres отвечает на него ошибкой кодировки, и одновременные записи она
# сериализует, а Postgres — нет. Разработка идёт на SQLite и будет идти
# дальше; расхождения ловятся здесь, а не на живых заказчиках.

name: Проверки

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    name: Тесты, типы, сборка
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://ci@ci/ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Провайдер во всей работе один и тот же — боевой. Клиент Prisma
      # генерируется под него, типы проверяются против него, сборка идёт с ним.
      # Проверять типы под SQLite, а собирать под Postgres значит проверять не
      # то, что поедет. Подключения при генерации не происходит: значение имеет
      # только буква провайдера, поэтому адрес заведомо нерабочий.
      - name: Клиент Prisma
        run: npx prisma generate

      - name: Модульные тесты
        run: npm test

      - name: Типы
        run: npm run typecheck

      # Схема под Postgres генерируется из основной. Отставшая проходит все
      # тесты и ломается на выкладке — там, где чинить дороже всего.
      - name: Схема под Postgres не отстала
        run: npm run db:schema:check

      - name: Сборка
        run: npm run build

  e2e:
    name: Сквозные пути
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Браузер
        run: npx playwright install --with-deps chromium

      # База, схема и синтетический пул: сквозные пути ходят по живым данным,
      # и ключи вроде seed-key-01 должны существовать.
      - name: База и пул
        run: npm run setup
        env:
          DATABASE_URL: file:./ci.db

      - name: Сборка
        run: npm run build
        env:
          DATABASE_URL: file:./ci.db

      - name: Сервер и проверки
        run: |
          npx next start -p 3100 &
          # Ждём готовности сами, без лишней зависимости: сервер отвечает на
          # /api/health, когда база на месте и приложение поднялось.
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3100/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3100/api/health > /dev/null || {
            echo 'Сервер не поднялся за минуту.'
            exit 1
          }
          npm run e2e
        env:
          DATABASE_URL: file:./ci.db
          # Панель бюро закрыта паролем, и сквозной тест приёма базы в неё
          # заходит. Пароль здесь одноразовый и живёт только внутри работы.
          BUREAU_OPS_PASSWORD: ci-only-not-a-secret
          BUREAU_SESSION_SECRET: ci-only-not-a-secret-either
          # Браузер ставится обычной установкой, а не лежит по фиксированному
          # пути, как в песочнице разработки: пустое значение уводит запуск на
          # тот, который нашёл сам Playwright.
          E2E_CHROMIUM: ''

  postgres:
    name: Боевая база
    runs-on: ubuntu-latest

    # Та же версия, что у хостинга: разница в версии — это разница в поведении.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bureau
          POSTGRES_PASSWORD: bureau
          POSTGRES_DB: bureau
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://bureau:bureau@127.0.0.1:5432/bureau
      BUREAU_OPS_PASSWORD: ci-only-not-a-secret
      BUREAU_SESSION_SECRET: ci-only-not-a-secret-either
      E2E_CHROMIUM: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Браузер
        run: npx playwright install --with-deps chromium

      - name: Клиент Prisma
        run: npx prisma generate

      # Цепочка миграций применяется целиком, с нуля. Локально этого не видно
      # вовсе: разработка идёт через db push, без миграций.
      - name: Миграции применяются
        run: npx prisma migrate deploy

      # И приводят ровно к объявленной схеме. Расхождение между цепочкой и
      # схемой проходит все тесты и ломается на выкладке — там, где чинить
      # дороже всего.
      - name: Цепочка совпадает со схемой
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.postgres.prisma --exit-code

      - name: Пул
        run: npm run db:seed

      - name: Сборка
        run: npm run build

      - name: Сервер и сквозные пути
        run: |
          npx next start -p 3100 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3100/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3100/api/health > /dev/null || {
            echo 'Сервер не поднялся за минуту.'
            exit 1
          }
          npm run e2e
