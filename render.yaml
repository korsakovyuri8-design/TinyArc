# Разворачивание на Render — целиком из браузера, компьютер не нужен.
#
# На render.com: New → Blueprint → выбрать этот репозиторий. Render прочитает
# файл, поднимет Postgres и приложение и спросит значения, помеченные ниже
# как `sync: false`. Их восемь, и это не бюрократия: без каждого из них
# приложение откажется стартовать, и откажется намеренно — см. scripts/start.sh
# и src/lib/env.ts.
#
# Что спросит Render и что отвечать:
#
#  · BUREAU_OPS_PASSWORD — пароль панели бюро. Придумайте длинный: панель
#    открывает все проекты и всю базу специалистов.
#  · BUREAU_SESSION_SECRET — чем подписываются cookie сессий. Любая длинная
#    случайная строка; при смене все входы слетают, и это нормально.
#  · BUREAU_LEGAL_NAME, BUREAU_LEGAL_REGISTRATION, BUREAU_LEGAL_ADDRESS,
#    BUREAU_LEGAL_EMAIL — реквизиты юридического лица. Оферта без наименования
#    и регистрационного номера — не договор, а политика обработки без адреса
#    для обращений не даёт человеку сделать то, на что у него есть право.
#    Поэтому в бою они обязательны, а не желательны.
#  · BUREAU_S3_ENDPOINT, BUREAU_S3_BUCKET, BUREAU_S3_ACCESS_KEY_ID,
#    BUREAU_S3_SECRET_ACCESS_KEY — хранилище материалов проекта. Подходит любое
#    S3-совместимое; Cloudflare R2 дешевле прочих и не берёт за исходящий
#    трафик. Диск контейнера здесь не подходит и запрещён явно: он живёт до
#    следующей выкладки, а отдавать заказчику комплект придётся сильно позже
#    неё (п.13).
#
# Что здесь стоит и почему:
#  · база и приложение в одном регионе, иначе каждый запрос идёт через океан;
#  · строка подключения приходит из самой базы — руками её нигде нет;
#  · BUREAU_MAIL=stub: письма не уходят, и это должно быть видно из
#    конфигурации, а не выясняться на человеке, которому нужен ключ доступа.
#    Ключ при этом показывается на экране, а кого надо позвать руками — видно
#    в панели на /ops/letters. Когда дойдут руки до почты: BUREAU_MAIL=resend
#    плюс RESEND_API_KEY и BUREAU_MAIL_FROM.
#  · BUREAU_IMAGES и BUREAU_ASSIST — заглушки: направления рисуются схемами
#    объёма, помощники пишут по шаблону. Продукт работает целиком, модели
#    подключаются потом ключами (OPENAI_API_KEY, ANTHROPIC_API_KEY).
#  · dockerCommand — демонстрационный: с синтетическим пулом. Для боевого
#    стенда замените на `sh ./scripts/start.sh`, и база останется пустой;
#  · domains — адрес продукта. Render выпустит сертификат сам, но только после
#    того, как в DNS появится запись: CNAME tinyarc → <имя сервиса>.onrender.com
#    в панели регистратора korsakovgroup.com. Точное значение Render показывает
#    на вкладке Settings → Custom Domains — берите его оттуда, не отсюда.
#
# Про бесплатный план: у него нет резервных копий базы. Для пилота с живыми
# заказчиками это не годится — план базы поднимается до платного там же, в
# Render, и это единственное место, где мы советуем потратить деньги сразу.
#
# Своя копия у продукта есть (`npm run backup`): логическая выгрузка всей базы
# строками в то же хранилище, что и материалы проектов. Она читается чем
# угодно и переживает смену провайдера, но восстановления на момент времени у
# неё нет — потеряно будет всё, что случилось после последней. То есть она не
# замена копиям провайдера, а то, что есть, пока их нет.
#
# Расписания для неё здесь нет намеренно. На Render это Cron Job — отдельный
# платный тип сервиса, и платную строку в счёт добавляет владелец, а не файл в
# репозитории. Сам запуск — `npm run backup` из любого планировщика.

databases:
  - name: bureau-db
    databaseName: bureau
    user: bureau
    plan: free
    region: frankfurt

services:
  - type: web
    name: tinyarc-bureau
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    dockerCommand: sh ./scripts/demo-start.sh
    domains:
      - tinyarc.korsakovgroup.com
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bureau-db
          property: connectionString

      # Адрес продукта. По нему собираются ссылки в письмах и карта сайта, и
      # он обязан совпадать с доменом выше: письмо со ссылкой на onrender.com
      # уводит человека с адреса, которому он доверился.
      - key: BUREAU_PUBLIC_URL
        value: https://tinyarc.korsakovgroup.com

      - key: BUREAU_MAIL
        value: stub
      - key: BUREAU_IMAGES
        value: stub
      - key: BUREAU_ASSIST
        value: stub

      # Хранилище материалов проекта. Диск контейнера preflight в бою
      # отвергает: он живёт до выкладки.
      - key: BUREAU_STORAGE
        value: s3

      # Render спросит значения при развёртывании и не станет хранить их в
      # репозитории. Без них приложение откажется стартовать — намеренно.
      - key: BUREAU_OPS_PASSWORD
        sync: false
      - key: BUREAU_SESSION_SECRET
        sync: false

      - key: BUREAU_LEGAL_NAME
        sync: false
      - key: BUREAU_LEGAL_REGISTRATION
        sync: false
      - key: BUREAU_LEGAL_ADDRESS
        sync: false
      - key: BUREAU_LEGAL_EMAIL
        sync: false
      # Реквизиты для платежей. Не обязательны для старта, но пока их нет,
      # счёт заказчику приходит без банковских данных и говорит об этом вслух.
      - key: BUREAU_LEGAL_BANK
        sync: false
      - key: BUREAU_LEGAL_TAX_ID
        sync: false

      - key: BUREAU_S3_ENDPOINT
        sync: false
      - key: BUREAU_S3_BUCKET
        sync: false
      - key: BUREAU_S3_ACCESS_KEY_ID
        sync: false
      - key: BUREAU_S3_SECRET_ACCESS_KEY
        sync: false
