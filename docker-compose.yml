# Локальный и пилотный стенд: приложение и его база.
#
# Здесь Postgres — та же база, что на бою. SQLite остаётся способом разработки
# на одной машине, но проверять миграции на нём бессмысленно.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bureau
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
      POSTGRES_DB: bureau
    volumes:
      - bureau-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bureau -d bureau']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bureau:${POSTGRES_PASSWORD}@db:5432/bureau
      BUREAU_MAIL: ${BUREAU_MAIL:-stub}
      BUREAU_OPS_PASSWORD: ${BUREAU_OPS_PASSWORD:?задайте BUREAU_OPS_PASSWORD}
      BUREAU_SESSION_SECRET: ${BUREAU_SESSION_SECRET:?задайте BUREAU_SESSION_SECRET}
    ports:
      - '${PORT:-3000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  bureau-db:
